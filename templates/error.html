{% extends "base.html" %}

{% block title %}Error{% endblock %}

{% block content %}

<h1> Something went wrong</h1>

<div class="card">
    <p>{{ message }}</p>

    {% if suggestion %}
        <p><strong>Suggestion:</strong> {{ suggestion }}</p>
    {% endif %}

    <a href="/" class="back-link">Back to analyzer</a>

</div>

{% endblock %}
